# Logitech G29 → command.json mapping
# USB: 046d:c24f = PS3 / PC mode (required). 046d:c260 = PS4 mode (rejected).
# Axis codes verified 2026-09-02 on the Ubuntu CS (046d:c24f --print-raw):
#   steer ABS_X=0, accel ABS_Z=2, brake ABS_RZ=5, clutch ABS_Y=1
# That is NOT the ArchWiki jstest order (Y/Z/Rz = throttle/brake/clutch).
# Buttons below are still guesses. Confirm with --print-raw.

manufacturer=ANSCER
serial_number=AR001
protocol_version=v2.0.0

# Hardware lock on G29 native/PS3 mode is 900 deg (±450). Change after evtest
# if Oversteer / hid-lg4ff range was set lower (e.g. 180 → example 89.6 deg).
steering_range_deg=900

# Pedals: kernel reports 0 = fully pressed, max = released. Invert to 0..1 pressed.
invert_pedals=1

# Axes (verified on this G29)
steer_abs_code=0
accel_abs_code=2
brake_abs_code=5
clutch_abs_code=1
hat_x_abs_code=16
hat_y_abs_code=17

# Face / paddles / shoulders — BTN_TRIGGER (288) + jstest index.
# Confirm with --print-raw before trusting these on the robot host.
btn_cross=288
btn_square=289
btn_circle=290
btn_triangle=291
btn_right_paddle=292
btn_left_paddle=293
btn_r2=294
btn_l2=295
btn_share=296
btn_options=297
btn_r3=298
btn_l3=299
btn_ps=302
btn_plus=307
btn_minus=308
btn_rotary_enter=309

# MQTT stub (Step 2 will connect this). ANSCER extension topic, not stock VDA 5050.
mqtt_topic=uagv/v2/ANSCER/AR001/command
mqtt_broker=tcp://127.0.0.1:1883
